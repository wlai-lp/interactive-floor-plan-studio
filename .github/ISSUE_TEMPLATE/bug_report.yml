name: Bug report
description: Report broken or unexpected behavior
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 151, Safari 20, Firefox 142
  - type: input
    id: deployment
    attributes:
      label: App version, commit, or deployment URL
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, console errors, or other evidence
      description: Remove secrets and personal information before posting.
  - type: dropdown
    id: regression
    attributes:
      label: Did this work before?
      options:
        - Not sure
        - Yes, this is a regression
        - No, this has never worked
