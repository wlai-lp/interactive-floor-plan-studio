name: Feature request
description: Propose a user-facing capability or improvement
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Interactive Floor Plan Studio.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user problem should this solve?
      placeholder: When I edit a floor plan, I need...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior you expect, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, constraints, or related issues.
