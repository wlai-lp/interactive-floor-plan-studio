name: Public browser smoke

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "scripts/**"
      - "vendor/ha-floorplan-promo/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/landing-browser-smoke.yml"

permissions:
  contents: read

jobs:
  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run export hydration regression test
        run: node --test tests/ha-export-hydration.test.mjs

      - name: Run duplicate Entity ID regression tests
        run: node --test tests/duplicate-entity-id.test.mjs

      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/hafloorplan-vite.log 2>&1 &
          echo $! > /tmp/hafloorplan-vite.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hafloorplan-vite.log
          exit 1

      - name: Verify rendered landing page defaults in headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner."
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:4173/ > /tmp/landing-rendered.html

          grep -q "Your Home Assistant Dashboard Should Look Like Your Home" /tmp/landing-rendered.html
          grep -q "From floor plan to dashboard in minutes" /tmp/landing-rendered.html
          grep -q "Add to HA" /tmp/landing-rendered.html
          grep -q "Native Picture Elements YAML" /tmp/landing-rendered.html
          grep -q "Open Editor" /tmp/landing-rendered.html
          grep -q "Watch Demo" /tmp/landing-rendered.html
          grep -q 'data-short-demo="true"' /tmp/landing-rendered.html
          grep -q 'data-demo-ready="true"' /tmp/landing-rendered.html

          if grep -q 'data-demo-error="true"' /tmp/landing-rendered.html; then
            echo "Short hero demo reported a runtime error."
            cat /tmp/hafloorplan-vite.log
            exit 1
          fi

          if grep -q 'role="dialog"' /tmp/landing-rendered.html; then
            echo "Full-demo dialog mounted before user activation."
            exit 1
          fi

          if grep -q 'data-full-demo="true"' /tmp/landing-rendered.html; then
            echo "Full promo mounted before user activation."
            exit 1
          fi

      - name: Verify click-triggered full demo behavior
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner."
            exit 1
          fi
          CHROME="$CHROME" BASE_URL="http://127.0.0.1:4173" node tests/landing-demo-browser-smoke.mjs

      - name: Verify Home Assistant export hydration with saved browser project
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner."
            exit 1
          fi
          CHROME="$CHROME" BASE_URL="http://127.0.0.1:4173" node tests/ha-export-browser-smoke.mjs

      - name: Verify duplicate Entity ID editor guardrail
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner."
            exit 1
          fi
          CHROME="$CHROME" BASE_URL="http://127.0.0.1:4173" node tests/duplicate-entity-id-browser-smoke.mjs

      - name: Capture landing screenshot
        if: always()
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 --window-size=1536,1000 --screenshot=/tmp/landing.png http://127.0.0.1:4173/ || true
          fi

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-smoke
          path: |
            /tmp/landing-rendered.html
            /tmp/landing.png
            /tmp/landing-full-demo.png
            /tmp/landing-demo-browser.log
            /tmp/ha-export.png
            /tmp/ha-export-browser.log
            /tmp/duplicate-entity-id.png
            /tmp/duplicate-entity-id-browser.log
            /tmp/hafloorplan-vite.log
          if-no-files-found: ignore
