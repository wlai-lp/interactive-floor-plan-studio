name: Landing browser smoke

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/landing-browser-smoke.yml"

permissions:
  contents: read

jobs:
  landing-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/hafloorplan-vite.log 2>&1 &
          echo $! > /tmp/hafloorplan-vite.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hafloorplan-vite.log
          exit 1

      - name: Verify rendered landing page in headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner."
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:4173/ > /tmp/landing-rendered.html

          grep -q "Your Home Assistant Dashboard Should Look Like Your Home" /tmp/landing-rendered.html
          grep -q "From floor plan to dashboard in minutes" /tmp/landing-rendered.html
          grep -q "Add to HA" /tmp/landing-rendered.html
          grep -q "Native Picture Elements YAML" /tmp/landing-rendered.html
          grep -q "Open Editor" /tmp/landing-rendered.html

          if grep -q "Watch 30-second demo" /tmp/landing-rendered.html; then
            echo "Unexpected demo CTA found in rendered landing page."
            exit 1
          fi

          if grep -q 'role="dialog"' /tmp/landing-rendered.html; then
            echo "Unexpected dialog found in rendered landing page."
            exit 1
          fi

      - name: Capture landing screenshot
        if: always()
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=1536,1000 --screenshot=/tmp/landing.png http://127.0.0.1:4173/ || true
          fi

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-browser-smoke
          path: |
            /tmp/landing-rendered.html
            /tmp/landing.png
            /tmp/hafloorplan-vite.log
          if-no-files-found: ignore
