name: Conventional PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --input-type=module -e 'import { isConventionalTitle } from "./scripts/versioning.mjs"; if (!isConventionalTitle(process.env.PR_TITLE)) { console.error("PR title must use Conventional Commits."); process.exit(1); }'
